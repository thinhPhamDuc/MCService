name: CI

# Khi nào chạy?
on:
  pull_request:          # mỗi PR: chạy test để biết có merge được không
  push:
    branches: [main]     # mỗi lần merge vào main: test + build + push image
  workflow_dispatch:     # cho phép bấm chạy tay trong tab Actions

# Mỗi branch/PR chỉ có 1 lần chạy tại một thời điểm: push mới sẽ HUỶ lần chạy cũ đang dở.
# Không có dòng này: push A rồi push B sát nhau, nếu A build xong SAU B thì bot ghi newTag = A
# -> cluster quay về bản CŨ. Huỷ A là an toàn vì commit B đã chứa luôn thay đổi của A.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest          # máy ảo Linux do GitHub cấp, xoá sạch sau mỗi lần chạy
    strategy:
      fail-fast: false              # 1 service fail thì 2 service kia vẫn chạy tiếp để xem kết quả
      matrix:
        service: [UserService, OrderService, PaymentService]   # nhân job thành 3 bản, chạy SONG SONG
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7            # lấy code về máy ảo

      - uses: actions/setup-java@v6          # cài JDK 17 (khớp toolchain trong build.gradle)
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6 # cache thư viện Gradle giữa các lần chạy -> lần sau nhanh hơn

      - run: ./gradlew test

      - name: Upload test report
        if: failure()                        # chỉ khi test fail: tải báo cáo HTML về xem lỗi
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test

  build-push:
    needs: test                 # chỉ chạy khi CẢ 3 job test đều xanh
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # PR chưa được duyệt -> không tạo image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # quyền ghi lên GitHub Packages (GHCR), chỉ cấp cho job này
    strategy:
      matrix:
        include:
          - service: UserService
            image: userservice
          - service: OrderService
            image: orderservice
          - service: PaymentService
            image: paymentservice
    steps:
      - uses: actions/checkout@v7

      # GHCR bắt buộc tên viết thường: "thinhPhamDuc" -> "thinhphamduc"
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Cho phép build image cho CPU khác với máy CI (máy CI là amd64, Mac chip Apple là arm64)
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token tự sinh cho mỗi lần chạy, KHÔNG cần tạo secret

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}        # thư mục chứa Dockerfile của service
          push: true
          # amd64: server/CI thông thường. arm64: Mac chip Apple (Docker Desktop K8s), AWS Graviton
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/mcservice-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/mcservice-${{ matrix.image }}:main
          # Cache layer Docker giữa các lần chạy CI
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # CD: ghi tag image vừa build vào Git -> ArgoCD thấy Git đổi -> tự deploy.
  # CI KHÔNG đụng vào cluster, chỉ sửa Git (mô hình GitOps "pull").
  update-manifest:
    needs: build-push           # chỉ chạy khi CẢ 3 image đã push thành công
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write           # quyền commit + push vào repo, chỉ cấp cho job này
    # Không cần concurrency riêng ở đây: concurrency ở đầu file đã đảm bảo trên main chỉ có 1 lần chạy
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main             # lấy main MỚI NHẤT (không phải commit đã kích hoạt) để push không bị từ chối

      - name: Set image tags to this commit
        # Monorepo: 1 commit build cả 3 image cùng SHA, nên đổi mọi dòng newTag về SHA này
        run: |
          sed -i -E "s|(newTag:).*|\1 ${GITHUB_SHA}|" deploy/envs/local/kustomization.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/local/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag đã đúng, không có gì để commit"
            exit 0
          fi
          git commit -m "deploy(local): ${GITHUB_SHA::7}"
          git push
