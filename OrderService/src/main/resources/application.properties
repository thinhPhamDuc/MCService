spring.application.name=OrderService
server.port=8082

# Mặc định dùng H2 in-memory để chạy từ IDE.
# Khi deploy, override bằng biến môi trường: SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{requestId:-}]

# Địa chỉ các service khác. Local: localhost. Khi deploy override bằng env
# SERVICES_USER_URL / SERVICES_PAYMENT_URL (vd: http://userservice:8081 trong Docker network)
services.user.url=http://localhost:8081
services.payment.url=http://localhost:8083
# Timeout khi gọi service khác (ms). Không có timeout thì 1 service chậm sẽ kéo sập cả hệ thống.
services.connect-timeout-ms=2000
services.read-timeout-ms=3000
