plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'
description = 'ImportService'

java {
    toolchain {
        // Service mới dùng Java 25 (virtual thread không bị pinning). 3 service cũ vẫn Java 17.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // JDBC thuần (JdbcTemplate) thay vì JPA: cần batch insert hàng nghìn dòng/lần, Hibernate tắt batching khi id là IDENTITY
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Flyway: schema viết tay bằng SQL (composite PK, index cho câu claim SKIP LOCKED) thay vì ddl-auto
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Test chạy trên MySQL thật trong Docker (H2 không giống MySQL ở SKIP LOCKED / ON DUPLICATE KEY)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
