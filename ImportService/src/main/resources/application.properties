spring.application.name=ImportService
server.port=8084

# Local: MySQL của docker compose (service import-db, map ra cổng 3307 để không đụng MySQL cài sẵn trên máy).
# Khi deploy override bằng env SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3307/import_db
spring.datasource.username=app
spring.datasource.password=secret
# >= writer (6) + worker (8) + vài connection cho API tiến độ — xem docs/csv-import-design.md mục 3
spring.datasource.hikari.maximum-pool-size=16
# Driver gộp batch 1000 câu INSERT thành vài câu multi-row INSERT (nhanh hơn nhiều lần).
# Đặt ở đây thay vì trong URL: URL bị override (env khi deploy, Testcontainers khi test) thì vẫn không mất.
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# Schema do Flyway tạo từ src/main/resources/db/migration
spring.flyway.enabled=true

# Request HTTP chạy trên virtual thread (Java 25)
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{requestId:-}] [%X{jobId:-}]

# ---------- Import CSV (docs/csv-import-design.md) ----------
# Spring mặc định chỉ cho upload 1 MB; file 1 triệu dòng x 15 cột khoảng 150-250 MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Nơi lưu file upload trong lúc chờ/đang ingest (docker compose: volume /data/imports, env IMPORT_STORAGE_DIR)
import.storage-dir=${java.io.tmpdir}/mcservice-imports
# Giai đoạn 1: 1 reader + N writer, mỗi lần ghi 1 chunk.
# Đo trên máy dev (8 CPU, 1 triệu dòng): 1 writer 31s, 3 writer 11s, 6 writer 8.3s, 12 writer 8.2s -> chọn 6.
# Lập luận cho từng thông số: docs/csv-import-implementation.md
import.ingest.writers=6
import.ingest.chunk-size=1000
import.ingest.queue-capacity=10
import.ingest.max-concurrent-jobs=1
# Reader ghi nhịp tim mỗi 10s; job INGESTING không có nhịp tim 2 phút (= 12 nhịp liên tiếp bị lỡ) coi như pod đã chết
import.ingest.heartbeat-interval=10s
import.ingest.stale-after=2m

# Giai đoạn 2: K worker (virtual thread) claim dòng NEW -> gọi bulk API -> ghi bảng customer
import.process.enabled=true
import.process.workers=8
import.process.claim-size=500
import.process.poll-interval=1s
import.process.stale-after=5m

# API bên thứ ba (docker compose: env IMPORT_API_BASE_URL=http://thirdparty-mock:8090)
import.api.base-url=http://localhost:8090
import.api.batch-size=100
# Số request đang gọi cùng lúc tối đa (chung mọi worker) ≈ số request/giây mong muốn × độ trễ API
import.api.max-concurrent=16
import.api.max-attempts=3
import.api.initial-backoff=200ms
import.api.max-rate-limit-waits=20
import.api.connect-timeout=2s
import.api.read-timeout=5s
