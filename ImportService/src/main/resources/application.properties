spring.application.name=ImportService
server.port=8084

# Local: MySQL của docker compose (service import-db, map ra cổng 3307 để không đụng MySQL cài sẵn trên máy).
# Khi deploy override bằng env SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# rewriteBatchedStatements=true: driver gộp batch 1000 câu INSERT thành 1 câu multi-row INSERT (nhanh hơn nhiều lần).
spring.datasource.url=jdbc:mysql://localhost:3307/import_db?rewriteBatchedStatements=true
spring.datasource.username=app
spring.datasource.password=secret
# >= writer (3) + worker (8) + vài connection cho API tiến độ — xem docs/csv-import-design.md mục 3
spring.datasource.hikari.maximum-pool-size=16

# Schema do Flyway tạo từ src/main/resources/db/migration
spring.flyway.enabled=true

# Request HTTP chạy trên virtual thread (Java 25)
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{requestId:-}]
