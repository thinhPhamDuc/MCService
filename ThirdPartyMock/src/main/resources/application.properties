spring.application.name=ThirdPartyMock
server.port=8090

# Mỗi request chạy trên 1 virtual thread: khi bật delay, hàng trăm request đang "ngủ" cùng lúc
# không chiếm hết thread pool của Tomcat.
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{requestId:-}]

# Số khách hàng tối đa trong 1 request bulk
mock.max-batch-size=100
# Giả lập sự cố (override bằng env MOCK_SIMULATE_DELAY_MS, MOCK_SIMULATE_ERROR_RATE,
# MOCK_SIMULATE_RATE_LIMIT_PER_SECOND hoặc đổi lúc đang chạy qua POST /admin/chaos). 0 = tắt.
mock.simulate.delay-ms=0
mock.simulate.error-rate=0.0
mock.simulate.rate-limit-per-second=0
