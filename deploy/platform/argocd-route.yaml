apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd          # route nằm CÙNG namespace với Service mà nó trỏ tới
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - argocd.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80