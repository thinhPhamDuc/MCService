apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: userservice                   # tên ngắn: overlay (deploy/envs/*) thay bằng image GHCR + tag
          imagePullPolicy: IfNotPresent   # tag là commit SHA (bất biến) nên node có sẵn thì dùng, chưa có thì kéo từ GHCR
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://user-db:5432/user_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:               # K8s đảm bảo dành ít nhất chừng này cho pod (dùng để chọn node)
              cpu: 250m             # 0.25 CPU
              memory: 384Mi
            limits:
              memory: 512Mi         # vượt mức này thì container bị kill (OOMKilled)
          startupProbe:             # cho Java tối đa 30 x 5s = 150s để khởi động
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice
  ports:
    - port: 8081          # port của Service (các pod khác gọi vào đây)
      targetPort: 8081    # port của container