apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: orderservice                   # tên ngắn: overlay (deploy/envs/*) thay bằng image GHCR + tag
          imagePullPolicy: IfNotPresent   # tag là commit SHA (bất biến) nên node có sẵn thì dùng, chưa có thì kéo từ GHCR
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://order-db:5432/order_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD
            # Gọi service khác qua tên Service trong cluster (giống hệt tên service trong compose)
            - name: SERVICES_USER_URL
              value: http://userservice:8081
            - name: SERVICES_PAYMENT_URL
              value: http://paymentservice:8083
          resources:
            requests:               # K8s đảm bảo dành ít nhất chừng này cho pod (dùng để chọn node)
              cpu: 250m             # 0.25 CPU
              memory: 384Mi
            limits:
              memory: 512Mi         # vượt mức này thì container bị kill (OOMKilled)
          startupProbe:             # cho Java tối đa 30 x 5s = 150s để khởi động
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
spec:
  selector:
    app: orderservice
  ports:
    - port: 8082          # port của Service (các pod khác gọi vào đây)
      targetPort: 8082    # port của container