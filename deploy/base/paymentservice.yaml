apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: paymentservice                   # tên ngắn: overlay (deploy/envs/*) thay bằng image GHCR + tag
          imagePullPolicy: IfNotPresent   # tag là commit SHA (bất biến) nên node có sẵn thì dùng, chưa có thì kéo từ GHCR
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://payment-db:5432/payment_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:               # K8s đảm bảo dành ít nhất chừng này cho pod (dùng để chọn node)
              cpu: 250m             # 0.25 CPU
              memory: 384Mi
            limits:
              memory: 512Mi         # vượt mức này thì container bị kill (OOMKilled)
          startupProbe:             # cho Java tối đa 30 x 5s = 150s để khởi động
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
spec:
  selector:
    app: paymentservice
  ports:
    - port: 8083          # port của Service (các pod khác gọi vào đây)
      targetPort: 8083    # port của container