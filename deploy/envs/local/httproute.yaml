apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-api
spec:
  parentRefs:
    - name: public          # gắn vào Gateway nào?
      namespace: gateway
  hostnames:
    - mcservice.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: userservice
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /orders        # đường dẫn của OrderService
      backendRefs:
        - name: orderservice
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /imports       # ImportService: upload CSV, tiến độ, lỗi, retry
      backendRefs:
        - name: importservice
          port: 8084
      # Upload file 150 MB lâu hơn 1 request API thường; không đặt thì Envoy cắt request sau 15 giây
      timeouts:
        request: 120s
