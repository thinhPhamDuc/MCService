# Overlay "local": môi trường chạy trên Kubernetes của Docker Desktop.
# ArgoCD theo dõi thư mục này. Deploy = đổi newTag (CI sẽ tự làm ở Bước 4 của Bài 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcservice

resources:
  - ../../base

images:
  - name: userservice
    newName: ghcr.io/thinhphamduc/mcservice-userservice
    newTag: 358cc9ee9027f9ec9a0bfe4f4c5a7f21733962d1
  - name: orderservice
    newName: ghcr.io/thinhphamduc/mcservice-orderservice
    newTag: 358cc9ee9027f9ec9a0bfe4f4c5a7f21733962d1
  - name: paymentservice
    newName: ghcr.io/thinhphamduc/mcservice-paymentservice
    newTag: 358cc9ee9027f9ec9a0bfe4f4c5a7f21733962d1
