# Overlay "local": môi trường chạy trên Kubernetes của Docker Desktop.
# ArgoCD theo dõi thư mục này. Deploy = đổi newTag (CI sẽ tự làm ở Bước 4 của Bài 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcservice

resources:
  - ../../base
  - httproute.yaml
  - thirdparty-mock.yaml

images:
  - name: userservice
    newName: ghcr.io/thinhphamduc/mcservice-userservice
    newTag: 401a056fb1fd7a26476a79cb73523a9ae64d9845
  - name: orderservice
    newName: ghcr.io/thinhphamduc/mcservice-orderservice
    newTag: 401a056fb1fd7a26476a79cb73523a9ae64d9845
  - name: paymentservice
    newName: ghcr.io/thinhphamduc/mcservice-paymentservice
    newTag: 401a056fb1fd7a26476a79cb73523a9ae64d9845
  # Import CSV. Tag ban đầu chưa có image trên GHCR: sau khi merge vào main, CI build xong sẽ tự đổi
  # mọi dòng newTag thành SHA mới (~6 phút). Trong lúc chờ, 2 pod này báo ImagePullBackOff là bình thường.
  - name: importservice
    newName: ghcr.io/thinhphamduc/mcservice-importservice
    newTag: 401a056fb1fd7a26476a79cb73523a9ae64d9845
  - name: thirdpartymock
    newName: ghcr.io/thinhphamduc/mcservice-thirdpartymock
    newTag: 401a056fb1fd7a26476a79cb73523a9ae64d9845
