spring.application.name=PaymentService
server.port=8083

# Mặc định dùng H2 in-memory để chạy từ IDE.
# Khi deploy, override bằng biến môi trường: SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{requestId:-}]

# Giả lập sự cố (có thể override bằng env PAYMENT_SIMULATE_DELAY_MS, PAYMENT_SIMULATE_ERROR_RATE
# hoặc đổi lúc đang chạy qua POST /admin/chaos)
payment.simulate.delay-ms=0
payment.simulate.error-rate=0.0
# Đơn hàng vượt số tiền này sẽ bị từ chối (lỗi nghiệp vụ)
payment.max-amount=10000000
