spring.application.name=UserService
server.port=8081

# Mặc định dùng H2 in-memory để chạy từ IDE.
# Khi deploy, override bằng biến môi trường: SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Healthcheck cho Docker/K8s: GET /actuator/health
management.endpoints.web.exposure.include=health,info

# Hiện requestId trong log dạng text (khi chạy local)
logging.pattern.level=%5p [%X{requestId:-}]
